name: Build NSE Option Analyzer APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find APK project ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          echo "Searching for APK ZIP..."

          ZIP_FILE=$(find . -type f -iname "*.zip" | grep -Ei "apk|android" | head -n 1 || true)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Android/APK ZIP file found."
            echo "Available ZIP files:"
            find . -type f -iname "*.zip" -print
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf build-src
          mkdir -p build-src

          echo "Extracting: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d build-src

          echo "Extracted files:"
          find build-src -maxdepth 5 -type f | head -200

      - name: Find Android Gradle project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find build-src -type f \
            -name "settings.gradle" -o -name "settings.gradle.kts" \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."

            echo "Searching for build.gradle files:"
            find build-src -type f \
              -name "build.gradle" -o -name "build.gradle.kts" -print

            exit 1
          fi

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle wrapper --gradle-version 8.7

          chmod +x gradlew

          echo "Gradle wrapper created."

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew assembleDebug --no-daemon

      - name: Find generated APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NSE-Option-Analyzer-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
