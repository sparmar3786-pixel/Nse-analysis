name: Build NSE Option Analyzer APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Show files
        run: |
          echo "ZIP files:"
          find . -type f -iname "*.zip" -print
          echo "Gradle files:"
          find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print

      - name: Extract APK project
        run: |
          mkdir -p build-src
          ZIP=$(find . -type f -iname "*.zip" | grep -i "apk" | head -1)

          if [ -z "$ZIP" ]; then
            echo "No APK ZIP found"
            exit 1
          fi

          echo "Using: $ZIP"
          unzip -q "$ZIP" -d build-src

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find build-src -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NSE-Option-Analyzer-APK
          path: '**/build/outputs/apk/debug/*.apk'
